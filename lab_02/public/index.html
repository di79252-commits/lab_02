
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Powiadomienia PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="notification.js" defer></script>
</head>
<body>
    <h1>Notification API i Web Push</h1>

    <section>
        <h2>1. Uprawnienia do powiadomień</h2>
        <p>Aktualne uprawnienie: <strong id="permission">sprawdzanie...</strong></p>
        <button id="enable" type="button">Włącz powiadomienia</button>
        <button id="local" type="button">Powiadomienie ze strony</button>
        <button id="sw" type="button">Powiadomienie z service workera</button>
    </section>

    <hr>

    <section>
        <h2>2. Własne powiadomienie</h2>
        <form id="notification-form">
            <p>
                <label for="notification-title">Tytuł:</label><br>
                <input id="notification-title" type="text" placeholder="Wpisz tytuł">
            </p>
            <p>
                <label for="notification-body">Treść:</label><br>
                <textarea id="notification-body" rows="3" placeholder="Wpisz treść powiadomienia"></textarea>
            </p>
            <p>
                <label for="notification-icon">Ikona:</label><br>
                <select id="notification-icon">
                    <option value="icons/apple-icon-180.png">Apple 180</option>
                    <option value="icons/favicon-196.png">Favicon 196</option>
                    <option value="icons/manifest-icon-192.maskable.png">Manifest 192</option>
                    <option value="icons/manifest-icon-512.maskable.png">Manifest 512</option>
                </select>
            </p>
            <button type="submit">Wyświetl powiadomienie</button>
        </form>
        <p id="form-status" role="status"></p>
    </section>

    <hr>

    <section>
        <h2>3. Subskrypcja Web Push</h2>
        <button id="subscribe" type="button">Subskrybuj powiadomienia push</button>
        <button id="unsubscribe" type="button">Anuluj subskrypcję</button>
        <p>
            <label for="subscription">Subskrypcja do zapisania w lab_02/subscription.json:</label><br>
            <textarea id="subscription" rows="10" cols="60" readonly></textarea>
        </p>
        <button id="copy" type="button">Kopiuj subskrypcję</button>
    </section>
</body>
</html>
